version: "3.9"

services:

  backend:
    build: ./backend

    container_name: gym_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - sqlite_data:/app/data

    command: >
      sh -c "
      mkdir -p /app/data &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build: ./frontend

    container_name: gym_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:

  sqlite_data: